name: Auto Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 셋업
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 의존성 패키지 설치
        run: npm install

      - name: package.json 버전 추출
        id: pkg_info
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "APP_VER=$ver" >> $env:GITHUB_ENV
          Write-Host "감지된 버전: $ver"

      - name: Vite 빌드 및 Electron Windows 실행 파일(EXE) 생성
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 [추가] release 폴더 내 .exe 파일명 변경 단계
      - name: 빌드된 파일 이름 변경 (점 -> 하이픈)
        shell: pwsh
        run: |
          Get-ChildItem "release/*.exe" | ForEach-Object {
              # 'Pare.IDE.Setup' 부분만 명확하게 하이픈으로 치환
              $finalName = $_.Name -replace 'Pare\.IDE\.Setup', 'Pare-IDE-Setup'
              Rename-Item $_.FullName -NewName $finalName
              Write-Host "파일명 변경 완료: $($_.Name) -> $finalName"
          }


      - name: 빌드된 산출물(exe) 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Pare-IDE-Windows
          path: release/*.exe

      - name: GitHub Release 자동 배포
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.APP_VER }}
          name: Pare IDE v${{ env.APP_VER }}
          files: |
            release/*.exe
            release/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
